server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Polskie znaki w llms.txt / robots.txt (text/plain).
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS Dockera; zmienna w proxy_pass sprawia, że nginx startuje nawet gdy api jeszcze nie działa.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;

    # API formularza (usługa api z docker-compose, niewystawiona publicznie).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    # Pliki z hashem w nazwie (Vite) — można cache'ować na zawsze.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Strona ma jeden adres (sekcje to kotwice #), więc nieznane ścieżki dostają prawdziwe 404
    # zamiast index.html z kodem 200 (soft 404 w Google).
    error_page 404 /404.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
